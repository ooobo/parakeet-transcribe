[package]
name = "parakeet-transcribe"
description = "simple one binary transcription using parakeet-rs"
version = "0.2.0"
authors = ["ooobo"]
edition = "2021"
repository = "https://github.com/ooobo/parakeet-transcribe"


[[bin]]
name = "parakeet-transcribe"
path = "src/main.rs"

[dependencies]
parakeet-rs = "0.3.4"
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
eyre = "0.6"
hf-hub = "0.4"
dirs = "5.0"

# Native audio decoding (replaces ffmpeg)
symphonia = { version = "0.5.5", features = ["all"] }
rubato = "0.15"

# copy to clipboard
arboard = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
